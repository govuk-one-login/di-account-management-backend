# cfn-lint configuration.
#
# This file is read by both the standalone `cfn-lint` invocation and by
# `sam validate --lint` (cfn-lint runs from this directory). Unlike the inline
# `Metadata.cfn-lint` block in a template, a config file here is honoured by
# `sam validate --lint`, which does not read inline template metadata.
#
# E3724 ("Validate Globals section and IgnoreGlobals entries") incorrectly
# flags `CodeSigningConfigArn` as an unexpected property of `Globals.Function`.
# It is a valid SAM `Globals.Function` property (see aws/aws-sam-cli#4274);
# this is a cfn-lint schema-lag false positive, so the check is ignored.
templates:
  - template.yaml
ignore_checks:
  - E3724
